# Торговая проверка (net_edge.py): правило фиксируется ДО прогона и по результату не
# подбирается (правило 8). Порог - в стандартных отклонениях OFI по ПРЕДЫДУЩИМ дням
# бумаги; horizon_s - удержание; commission_bps - round-trip по тарифу «Премиум»
# (0.04% за сторону), спред добавляется отдельно по факту на входе и выходе.
# q_sensitivity - пороги, которые считаются тем же точным проходом для проверки
# устойчивости, а НЕ для выбора лучшего.
net_edge:
  threshold_q: 1.5
  q_sensitivity: [1.0, 1.5, 2.0]
  horizon_s: 60
  commission_bps: 8.0
  min_train_days: 5
