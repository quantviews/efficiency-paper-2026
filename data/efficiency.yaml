# Эксперимент «эффективность рынка РФ после 2022» - определение прогона.
#
# Правило 6 проекта: эксперимент = файл конфига + сид. Раньше универсум, периоды и
# параметры вывода жили константами в efficiency_study.py, и «прогон» нельзя было
# описать иначе как ссылкой на версию кода. Теперь определение здесь, а код читает
# его через load_efficiency_config().
#
# Путей и токенов здесь НЕТ (правило 4) - только проектные решения.
# Изменение любого значения ниже меняет эксперимент: пересчитывайте прогон целиком,
# а не подмешивайте новые значения к сохранённому parquet. Хеш этого файла
# записывается в манифест прогона.


# Сид всего статистического вывода: бутстрап, перестановки.
seed: 12345

# Число реплик блочного бутстрапа по датам.
bootstrap_iterations: 4000

# Сколько торговых дней брать в каждом календарном месяце.
# При 2 правило отбирает первый и последний доступный день месяца.
days_per_month: 2

# Шаг сетки снимков. main - основная спецификация (устойчива к застыванию
# цены), robustness - проверочная.
grids_ms:
  main: 5000
  robustness: 1000

# Непрерывная сессия МосБиржи. Единственное окно, стабильно присутствующее
# на всём горизонте: покрытие архива меняется 06.12.2021 (см. docs/12).
session:
  start: '10:00:00'
  end: '18:40:00'

# Границы периодов. Первое полугодие 2022 исключено целиком: закрытие биржи
# 28.02-23.03 и последующий хаотичный режим.
periods:
  '2021':
  - '2021-01-01'
  - '2021-12-31'
  2022-H2:
  - '2022-07-01'
  - '2022-12-31'
  '2023':
  - '2023-01-01'
  - '2023-12-31'
  '2024':
  - '2024-01-01'
  - '2024-12-31'
  '2025':
  - '2025-01-01'
  - '2025-06-30'

# Универсум упорядочен по убыванию ликвидности (ранг по числу записей
# OrderLog за 2021), тир задаётся положением в списке.
tier_size: 20
tier_names:
- ликвидные
- средние
- менее ликвидные

# Отсечка на ранге 60: глубже книга почти статична, VR вырождается в 1.0.
